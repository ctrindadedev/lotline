services:
  db:
    image: postgis/postgis:17-3.6-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lotline}
      POSTGRES_USER: ${POSTGRES_USER:-lotline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lotline}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:

services:
  db:
    image: postgis/postgis:17-3.6-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lotline}
      POSTGRES_USER: ${POSTGRES_USER:-lotline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lotline}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-lotline}
      DB_USER: ${POSTGRES_USER:-lotline}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lotline}
      SPRING_LIQUIBASE_CONTEXTS: default,demo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:8080/actuator/health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build: ./frontend
    ports:
      - '${WEB_PORT:-8080}:8080'
    # nginx resolves the api host name once, at start, and exits if it does not exist yet.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:8080/']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:

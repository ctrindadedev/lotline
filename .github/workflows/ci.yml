name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Format, unit + integration tests (Testcontainers uses the runner's Docker) and coverage gate
      - run: ./gradlew check
      - name: Coverage in the run summary
        if: ${{ !cancelled() && hashFiles('backend/build/reports/jacoco/test/jacocoTestReport.xml') != '' }}
        run: python3 ../.github/scripts/coverage_summary.py backend build/reports/jacoco/test/jacocoTestReport.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/html/
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Coverage in the run summary
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        run: python3 ../.github/scripts/coverage_summary.py frontend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  stack:
    name: Full stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds both images, then waits until db, api and web report healthy
      - run: docker compose up --build --wait --wait-timeout 300
      - name: The app is served and the API answers through nginx, with the sample plots
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS 'http://localhost:8080/api/v1/plots?bbox=-47.2,-23.0,-46.9,-22.8' \
            | jq -e '.features | length >= 6'
      - name: The app is served with security headers and no nginx version
        run: |
          for page in / /assets/; do
            headers=$(curl -sS -o /dev/null -D - "http://localhost:8080$page")
            echo "$headers" | grep -qi '^x-content-type-options: nosniff'
            echo "$headers" | grep -qi '^x-frame-options: DENY'
            echo "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'
            # A negated command never fails a step under set -e: test it explicitly.
            if echo "$headers" | grep -qi '^server: nginx/'; then exit 1; fi
          done
      - name: An anonymous visitor gets the CSRF cookie needed to log in
        run: |
          curl -sS -o /dev/null -D - http://localhost:8080/api/v1/auth/me \
            | grep -qi '^set-cookie: XSRF-TOKEN='
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
